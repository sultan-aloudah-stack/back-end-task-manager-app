<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager App</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
    .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
    h2 { text-align: center; color: #333; }
    form { display: flex; gap: 10px; margin-bottom: 20px; }
    input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 10px 15px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #218838; }
    ul { list-style-type: none; padding: 0; }
    li { background: #eee; margin-bottom: 8px; padding: 10px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
    .delete-btn { background-color: #dc3545; padding: 5px 10px; }
    .delete-btn:hover { background-color: #c82333; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Task Manager</h2>
    <form id="taskForm">
      <input type="text" id="taskInput" placeholder="Enter a new task..." required>
      <button type="submit">Add Task</button>
    </form>
    <ul id="taskList"></ul>
  </div>

  <script>
    const API_URL = 'http://localhost:5000/api/tasks';

    // Fetch and display tasks (Read)
    async function fetchTasks() {
      try {
        const response = await fetch(API_URL);
        const tasks = await response.json();
        const taskList = document.getElementById('taskList');
        taskList.innerHTML = '';
        
        tasks.forEach(task => {
          const li = document.createElement('li');
          li.innerHTML = `
            <span>${task.title}</span>
            <button class="delete-btn" onclick="deleteTask('${task._id}')">Delete</button>
          `;
          taskList.appendChild(li);
        });
      } catch (error) {
        console.error('Error fetching tasks:', error);
      }
    }

    // Add new task (Create)
    document.getElementById('taskForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const taskInput = document.getElementById('taskInput');
      const title = taskInput.value.trim();

      if (!title) return;

      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title })
      });

      taskInput.value = '';
      fetchTasks();
    });

    // Delete task (Delete)
    async function deleteTask(id) {
      await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
      fetchTasks();
    }

    // Initial load
    fetchTasks();
  </script>

</body>
</html>
